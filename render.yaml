services:
  - type: web
    name: bruin-bites
    runtime: node
    plan: free
    region: oregon
    branch: main
    # NODE_ENV=production makes npm skip devDependencies, and the client needs Vite to build
    buildCommand: npm ci --prefix server && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
